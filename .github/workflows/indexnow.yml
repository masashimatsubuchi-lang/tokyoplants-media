# main に記事などが入ったら、Vercel の公開を待ってから IndexNow で Bing などに知らせる（scripts/indexnow.mjs）
name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "public/llms.txt"
      - "src/app/items/**"
      - "src/lib/recommendedItems.ts"
      - "src/app/about/**"
  # 手で送るとき（Actions の画面または gh workflow run indexnow.yml -f urls="URL URL"）
  workflow_dispatch:
    inputs:
      urls:
        description: "送る URL（空白区切り）"
        required: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vercel のビルドと公開に約2〜3分かかるので、公開後に Bing が読みに来るよう少し待つ
      - if: github.event_name == 'push'
        run: sleep 240
      - if: github.event_name == 'push'
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - if: github.event_name == 'workflow_dispatch'
        run: node scripts/indexnow.mjs --url ${{ inputs.urls }}
